[project]
name = "quant-data-warehouse"
version = "0.1.0"
description = "Multi-source quantitative data warehouse - A-share, crypto, financial reports"
requires-python = ">=3.10"
dependencies = [
    "tushare>=1.4.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "apscheduler>=3.10",
    "duckdb>=1.0",
    "duckdb-engine>=0.13",
    "polars>=1.0",
    "pyarrow>=17.0",
    "ccxt>=4.4",
    "httpx>=0.27",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.5",
    "pre-commit>=3.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
